<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner</title>
<style>body{font-family:Arial;background:#eaf6ff;padding:20px} .card{background:white;padding:20px;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.1);margin-bottom:15px} input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc} button{background:#3a8cff;color:white;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;width:100%;margin-top:5px}</style></head><body>
<h2>👑 Owner Dashboard - Abdulmalik</h2>
<div class="card"><h3>Add Advert</h3><input id="adTitle" placeholder="Title"><textarea id="adText" placeholder="Advert text"></textarea><button onclick="addAd()">Post Advert ✨</button></div>
<div class="card"><h3>Orders</h3><p id="orders">Loading...</p></div>
<div class="card"><h3>Adverts Live</h3><p id="adverts">Loading...</p></div>
<div class="card"><a href="/">← Q Chat</a></div>
<script>
async function load(){let o=await fetch('/api/orders');let ord=await o.json(); orders.innerHTML=ord.length?ord.map(x=>`<div>${x.name||'Anon'}: ${x.item||x.message} - ${new Date(x.time).toLocaleString()}</div>`).join(''):'No orders yet'; let a=await fetch('/api/adverts');let adv=await a.json(); adverts.innerHTML=adv.map(x=>`<div><b>${x.title}</b>: ${x.text||x.title}</div>`).join('');}
async function addAd(){let data={title:adTitle.value, text:adText.value}; await fetch('/api/adverts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); adTitle.value=''; adText.value=''; load();}
load();
</script></body></html>
