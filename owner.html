<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Window Studio v6.0</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px}input{width:90%;padding:10px;margin:5px;border-radius:8px;background:#111;color:#ffd700;border:1px solid #ffd700}button{padding:8px 14px;margin:3px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}.gold{background:#ffd700;color:#000}.win{border:1px solid #333;border-radius:10px;padding:10px;margin:8px 0;background:#111;display:flex;justify-content:space-between;align-items:center}a{color:#ffd700;border:1px solid #ffd700;padding:5px 10px;border-radius:20px;text-decoration:none}</style></head><body>
<h3 style="color:#ffd700">🪟 Window Studio v6.0 - Create Unlimited</h3><a href="/">← OS</a> <a href="/register.html">Register</a>
<div style="margin-top:15px;background:#111;padding:12px;border-radius:10px;border:1px solid #ffd700"><h4>Create New Window</h4>
<input id="name" placeholder="Name e.g Phones"><input id="icon" placeholder="Icon e.g 📱"><input id="color" placeholder="Color e.g #0067b8 or blue" value="#0067b8"><input id="cat" placeholder="Category e.g Electronics"><button class="gold" onclick="createWin()">+ Create Window</button><div id="msg"></div></div>
<h4>Your Windows - ON/OFF</h4><div id="list"></div>
<script>
async function load(){const r=await fetch('/api/windows');const w=await r.json();document.getElementById('list').innerHTML=w.length?w.map(x=>`<div class="win"><div><div style="font-size:20px">${x.icon||'📦'} ${x.name}</div><div style="font-size:12px;color:#aaa">${x.category||''} - ${x.status||'ON'} - ${x.color}</div></div><div><button class="gold" onclick="toggle('${x.id}','${x.status}')">${x.status==='ON'?'Turn OFF':'Turn ON'}</button> <button onclick="delWin('${x.id}')" style="background:red;color:#fff">Delete</button></div></div>`).join(''):'No windows yet - create above';}
async function createWin(){const body={name:document.getElementById('name').value,icon:document.getElementById('icon').value,color:document.getElementById('color').value,category:document.getElementById('cat').value};if(!body.name)return alert('Name needed');const r=await fetch('/api/windows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();document.getElementById('msg').innerText=j.ok?'✅ Created!':'❌ Failed';load();}
async function toggle(id,status){await fetch(`/api/windows/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status==='ON'?'OFF':'ON'})});load();}
async function delWin(id){if(!confirm('Delete?'))return;await fetch(`/api/windows/${id}`,{method:'DELETE'});load();}
load();
</script></body></html>
