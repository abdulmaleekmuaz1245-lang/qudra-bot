<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Window Studio v6.0</title>
<style>body{background:#000;color:#ffd700;font-family:Arial;padding:10px}input,select{padding:8px;border-radius:6px;border:1px solid #ffd700;background:#111;color:#ffd700;margin:4px}button{padding:8px 14px;border-radius:20px;background:#ffd700;color:#000;border:none;font-weight:bold;margin:4px;cursor:pointer}.tile{border:1px solid #ffd700;border-radius:10px;padding:10px;margin:8px 0;background:#0f0f0f}a{color:#ffd700;text-decoration:none;border:1px solid #ffd700;padding:5px 10px;border-radius:15px;margin:3px;display:inline-block}</style></head><body>
<h3>🎨 Window Studio - Owner Control - Q OS v6.0</h3><a href="/">← Back to OS</a>
<div class="tile"><h4>6. Create New Window Template</h4>
<input id="wName" placeholder="Window Name e.g Ramadan Window"><input id="wIcon" placeholder="Icon e.g 🌙"><select id="wColor"><option value="#0078D7">Blue</option><option value="#D83B01">Red</option><option value="#107C10">Green</option><option value="#E3008C">Pink</option><option value="#ffb900">Gold</option></select><select id="wSize"><option value="medium">Medium</option><option value="wide">Wide</option><option value="large">Large</option></select><input id="wCat" placeholder="Category e.g Electronics"><button onclick="createWin()">+ Create Window</button></div>
<div class="tile"><h4>8,9,10 Category ON/OFF + Anti-Blank</h4><div id="winList"></div></div>
<div class="tile"><h4>11 Product Upload Inside Window</h4><select id="pWin"></select><input id="pName" placeholder="Product Name"><input id="pPrice" placeholder="Price N5k"><input id="pImg" placeholder="Image URL"><button onclick="addProd()">Upload Product</button><div id="prodList"></div></div>
<div class="tile"><h4>13,14,15 Expire & Invalid Manager</h4><button onclick="loadAll()">Load All Products (including invalid)</button><div id="allProd"></div></div>
<script>
async function loadWins(){
  const r=await fetch('/api/windows?owner=1'); const wins=await r.json();
  document.getElementById('winList').innerHTML=wins.map(w=>`<div style="border:1px solid #333;padding:6px;margin:4px;border-radius:6px;display:flex;justify-content:space-between;align-items:center"><span>${w.icon} ${w.name} (${w.category}) - ${w.on?'ON':'OFF'}</span><span><button onclick="toggleWin('${w.id}',${!w.on})">${w.on?'OFF':'ON'}</button><button onclick="customWin('${w.id}')">Customize</button></span></div>`).join('');
  document.getElementById('pWin').innerHTML=wins.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
}
async function createWin(){ const body={ name:document.getElementById('wName').value, icon:document.getElementById('wIcon').value, color:document.getElementById('wColor').value, size:document.getElementById('wSize').value, category:document.getElementById('wCat').value }; await fetch('/api/windows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); loadWins(); }
async function toggleWin(id,on){ await fetch('/api/windows/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({on})}); loadWins(); }
async function customWin(id){ const icon=prompt('New icon?'); const color=prompt('New color hex e.g #ff0000'); if(icon||color){ await fetch('/api/windows/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({icon,color})}); loadWins(); } }
async function addProd(){ const body={ windowId:document.getElementById('pWin').value, name:document.getElementById('pName').value, price:document.getElementById('pPrice').value, image:document.getElementById('pImg').value }; await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); loadProds(); }
async function loadProds(){ const r=await fetch('/api/products/all'); const ps=await r.json(); document.getElementById('prodList').innerHTML=ps.slice(-10).map(p=>`${p.name} - ${p.price} - valid:${p.valid} out:${p.outOfStock} <button onclick="delProd('${p.id}')">Delete</button> <button onclick="outProd('${p.id}')">OutOfStock</button>`).join('<br>'); }
async function loadAll(){ const r=await fetch('/api/products/all'); const ps=await r.json(); document.getElementById('allProd').innerHTML=ps.map(p=>`${p.name} - ${p.windowId} - valid:${p.valid} - <button onclick="delProd('${p.id}')">Archive Invalid</button>`).join('<br>'); }
async function delProd(id){ await fetch('/api/products/'+id,{method:'DELETE'}); loadProds(); loadAll(); }
async function outProd(id){ await fetch('/api/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({outOfStock:true})}); loadProds(); }
loadWins(); loadProds();
</script></body></html>
