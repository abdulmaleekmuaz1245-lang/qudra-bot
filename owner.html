<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner v7.0 - MY2 Full Battery</title>
<style>body{background:#000;color:#ffd700;font-family:Arial;margin:0;padding:0 8px 75px 8px}.chat{height:68vh;overflow-y:auto;border:1.5px solid #ffd700;border-radius:14px;padding:10px;background:#000;margin:10px 0}.bubble{border-radius:16px;padding:9px 12px;margin:7px 0;max-width:84%;font-size:14px}.you{background:#ffd700;color:#000;margin-left:auto}.q{background:#1c1c1c;color:#ffd700}.bar{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px 8px;display:flex;gap:8px;border-top:1.5px solid #ffd700}.bar input{flex:1;padding:12px 14px;border-radius:25px;border:1.5px solid #ffd700;background:#111;color:#ffd700;outline:none}.bar button{padding:12px 18px;border-radius:25px;background:#ffd700;color:#000;border:none;font-weight:bold}#lock{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}</style></head><body>
<div id="lock"><h3>🔒 OWNER v7.0 LOCKED - MY2 Full Battery</h3><input id="pin" type="password" placeholder="PIN: MY2KING100" style="padding:12px 14px;border-radius:25px;border:1.5px solid #ffd700;background:#111;color:#ffd700;width:230px;text-align:center;margin:15px;font-size:14px"><button onclick="unlock()" style="padding:12px 24px;border-radius:25px;background:#ffd700;color:#000;border:none;font-weight:bold">UNLOCK</button><p id="err" style="color:red;margin-top:10px"></p><a href="/" style="color:#ffd700;margin-top:18px;text-decoration:none;border:1.5px solid #ffd700;padding:6px 12px;border-radius:15px">Go PUBLIC</a></div>

<script>const chat=document.getElementById('chat'),input=document.getElementById('input'),lock=document.getElementById('lock');const PIN="MY2KING100";if(localStorage.getItem('ownerV7')==='yes')lock.style.display='none';function unlock(){const p=document.getElementById('pin').value;if(p===PIN){localStorage.setItem('ownerV7','yes');lock.style.display='none';add('Salam King MY2! v7.0 Full Battery live! Ya Qawiyy!','q')}else document.getElementById('err').textContent='Wrong PIN!'}function add(t,cls){const d=document.createElement('div');d.className='bubble '+cls;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){if(localStorage.getItem('ownerV7')!=='yes')return;const q=input.value.trim();if(!q)return;add('You: '+q,'you');input.value='';const tmp=document.createElement('div');tmp.className='bubble q';tmp.textContent='Qudra v7.0 Full Battery dey think...';chat.appendChild(tmp);chat.scrollTop=chat.scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,isOwner:true})});const j=await r.json();tmp.remove();add('Q: '+j.reply,'q')}catch(e){tmp.remove();add('Q: Error King','q')}}input.addEventListener('keypress',e=>{if(e.key==='Enter')send()});</script></body></html>
