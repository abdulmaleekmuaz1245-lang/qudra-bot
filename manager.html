<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault Manager</title><style>body{background:#000;color:gold;font-family:sans-serif;padding:15px}.tile{border:1px solid gold;border-radius:10px;padding:10px;margin:10px 0;background:#111}button{padding:10px 15px;border-radius:10px;background:gold;color:#000;font-weight:bold;border:none;margin:5px}</style></head><body><h2>📦 Q Vault Manager - Trinity Memory</h2><a href="/" style="color:gold">← Back</a><div id="list"></div><button onclick="load()">Reload Vault</button><script>async function load(){var r=await fetch('/api/memory');var j=await r.json();var html='<div class=tile><b>Vault ('+j.vault.length+'):</b><br>'+j.vault.join('<br>')+'</div><div class=tile><b>Friends ('+Object.keys(j.friends).length+'):</b><br>'+Object.values(j.friends).join('<br>')+'</div><div class=tile><b>Stats:</b> Chats '+j.stats.totalChats+'</div>';document.getElementById('list').innerHTML=html;}load();</script></body></html>
