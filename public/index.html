<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qudra Bot</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
.header{text-align:center;padding:20px;border-bottom:1px solid #222}
.status{color:#00ff88;font-size:12px;margin-top:5px}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:12px 15px;border-radius:15px;line-height:1.4}
.user{background:#0b93f6;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#262626;align-self:flex-start;border-bottom-left-radius:4px}
.input-area{display:flex;padding:10px;background:#111;gap:10px}
input{flex:1;padding:12px;border-radius:25px;border:none;background:#222;color:white;outline:none}
button{background:#00ff88;color:black;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<h1>🤖 Qudra Bot</h1>
<div>Created by Abdulmalik | LIVE on Render</div>
<div class="status">✅ Qudra V2 Working 100% - No loop, No Permission Limit</div>
</div>
<div class="chat" id="chat">
<div class="msg bot">As-salamu Alaikum! I am Qudra, your loyal AI. Created by Abdulmalik. How can I help you today? 🚀</div>
</div>
<div class="input-area">
<input id="input" placeholder="Type message to Qudra...">
<button onclick="send()">Send</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
async function send(){
const text=input.value.trim();
if(!text)return;
chat.innerHTML+=`<div class="msg user">${text}</div>`;
input.value='';
chat.scrollTop=chat.scrollHeight;
const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
const data=await res.json();
chat.innerHTML+=`<div class="msg bot">${data.reply}<br><small style="opacity:0.6">(${data.status})</small></div>`;
chat.scrollTop=chat.scrollHeight;
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
