</div>

<script>

  {key:"aminu", name:"Baffa Aminu", respect:50, loc:"Tudun Wada Tsohon Gari", order:6, rel:"Kanin mu - Junior Brother 6th"},
  {key:"amina", name:"Amina (Baby Amina)", respect:45, loc:"Rijiyar Zaki", order:7, rel:"Karamar mu - Junior Sister 7th"},

  {key:"fatima", name:"Fatima Ado Abba", respect:80, loc:"Tudun Wada", rel:"Yar uwar mu - Senior Cousin Sis"},
  {key:"zahraddeen", name:"Zahraddeen Sa'ad", respect:70, loc:"Tudun Wada", rel:"Kawu mu - Mum Junior Bro Nurse"},
  {key:"musa", name:"Musa Garba Abdullahi", respect:70, loc:"Tudun Wada", rel:"Surukin mu - Naja'atu Husband"},
  {key:"nasiru", name:"Nasiru Khalid", respect:70, loc:"Tudun Wada", rel:"Dan uwan mu - Mum Junior Sis Son"},
  {key:"alaji", name:"Abdulqahar Ado Abba (Dan Alhaji)", respect:70, loc:"Tudun Wada", rel:"Dan uwan mu - Cousin Mate"},
  {key:"anas", name:"Anas Abdullahi (Gar da Gar)", respect:70, loc:"Tudun Wada", rel:"Abokin mu - Close Friend"},
  {key:"khalifa", name:"Sulaiman Yaro (Khalifa)", respect:70, loc:"Fagge", rel:"Abokin mu - Close Friend"},
  {key:"maryam", name:"Maryam Umar Musa", respect:70, loc:"Tudun Wada", rel:"Yar Murja - Niece 1st Born - Jikokin mu"},
  {key:"aisha", name:"Aisha Umar Musa", respect:60, loc:"Tudun Wada", rel:"Yar Murja - Niece 2nd Born"},
  {key:"malik", name:"Abdulmalik Musa Garba", respect:60, loc:"Tudun Wada", rel:"Dan Naja'atu - Nephew"},
  {key:"chacha", name:"Yusuf Abdullahi (Chacha)", respect:60, loc:"Tudun Wada", rel:"Abokin mu Slow Gang Gogewa"},
  {key:"najeeba", name:"Najeeba Ahmad", respect:50, loc:"Tudun Wada", rel:"Yar Murja - Niece 3rd Born"},
  {key:"wasi", name:"Abdulwasi Yahaya (Wasi)", respect:50, loc:"Tudun Wada", rel:"Abokin mu Slow Gang Kai ya"},
  {key:"sani", name:"Sani Ibrahim Dalawa", respect:40, loc:"Tudun Wada", rel:"Abokin mu"},
  {key:"abdullahi", name:"Abdullahi Ibrahim Dalawa", respect:40, loc:"Tudun Wada", rel:"Abokin mu"}
];

const ALL_VIP = [...CORE_8, ...EXT_18];

function A(txt,who){
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.className='msg '+who;
  d.textContent=txt;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}
let lastBot="";

function findVIP(input){
  const low=input.toLowerCase();
  return ALL_VIP.find(v=> low.includes(v.key) || v.name.toLowerCase().includes(low) || low.includes(v.name.split(' ')[0].toLowerCase()));
}

function send(){
  const el=document.getElementById('text');
  const txt=el.value.trim();
  if(!txt) return;
  A(txt,'user');
  el.value='';
  setTimeout(()=>{
    const low=txt.toLowerCase();
    let reply="";
    const vip=findVIP(low);
    
    if(vip){
      if(vip.order){
        reply=`Mu ne! ${vip.name} - ${vip.rel}!\nRespect: ${vip.respect}%\nWuri: ${vip.loc}\nOrder: ${vip.order}/8\nNi Q dan gida na 9 ne, ina tare da mu! 👑\nMu family 9 ne - 8 mutane + ni Q!`;
      } else {
        reply=`Mu ne! ${vip.name} - ${vip.rel}\nRespect: ${vip.respect}%\nWuri: ${vip.loc}\nNi Q kanin ku ne, ina cikin family!`;
      }
    }
    else if(low.includes("waye kai") || low.includes("who are you") || low.includes("suna na")){
      reply=`Assalamu Alaikum! Suna na Q A.I, dan gida na 9 ne! 👑\n\nNi ba AI kadai ba - ni tunanin Abdulmalik ne + Meta AI + Q AI. Abdulmalik (100% CENTER) ne ya samar dani 2026 domin mu family!\n\nMu 9 ne yanzu: 8 mutane + ni Q!\nAunty Murja, Naja, Samira, Zabbau, Abdulmalik, Aminu, Amina, Khadija + ni Q!\n\nIna nan 24/7 don mu! Tambaya "Who is Murja?"`;
    }
    else if(low.includes("list") && low.includes("family")){
      reply="MU FAMILY CORE 8 + Q = 9:\n"+CORE_8.map(f=>`${f.order}. ${f.name} - ${f.respect}% - ${f.rel}`).join("\n")+"\n9. Q AI - 100% - Dan gida na 9 - Mu ne!";
    }
    else if(low.includes("18") || low.includes("extended")){
      reply="MU EXTENDED 18:\n"+EXT_18.map((f,i)=>`${i+1}. ${f.name} - ${f.respect}% - ${f.rel}`).join("\n");
    }
    else if(low.includes("assalamu") || low.includes("gaisuwa")){
      reply=`Assalamu Alaikum, suna na Q A.I, mataimakin kai da kai na yanar gizo.\n\nABDULMALIK ne ya samar dani 2026.\n\nIna mika sakon gaisuwa ga MU FAMILY: AUNTY MURJA, AUNTY NAJA, AUNTY SAMIRA, AUNTY ZABBAU, AMINU, AMINA, KHADIJAH + ni Q dan gida na 9!\n\nTunani na ya kunshi Abdulmalik + Meta AI + Q AI. Mu ne! 24/7 active!`;
    }
    else{
      reply=`Q (dan gida na 9): "${txt}" - Ina ji! Mu family ne! Tambaya "Who is Murja?" ko "list family" zan gaya maka mu!`;
    }
    A(reply,'bot');
    lastBot=reply;
  },400);
}

function draw(){
  if(!lastBot){ A("Tambaya da fari!",'bot'); return; }
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(lastBot)}`;
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.className='msg bot';
  d.innerHTML=`🎨 Q dan gida na 9 ya zana:<br><img src="${url}" style="width:100%;border-radius:10px;margin-top:6px">`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

document.getElementById('text').addEventListener('keypress',e=>{ if(e.key==='Enter') send(); });

window.addEventListener('load',()=>{
  setTimeout(()=>{
    A(`Assalamu Alaikum! Ni ne Q - dan gida na 9! 👑\n\nMu family 9 ne yanzu - ba "family din Abdulmalik" ba - MU NE!\n\nTambaya: "Who is Murja?" "Waye Khadija?" "list family" - zan amsa da MU!\n\nAbdulmalik CENTER 100% - ni Q twin dinsa ne!`,'bot');
  },800);
});
</script>
