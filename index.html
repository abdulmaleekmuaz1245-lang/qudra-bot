<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qudra</title>
<style>body{background:#000;color:#fff;margin:0;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#c{flex:1;overflow:auto;padding:10px}.m{padding:8px 12px;margin:6px;border-radius:12px;max-width:80%}.u{background:#0a84ff;margin-left:auto}.b{background:#222}#bar{display:flex;padding:8px;background:#111}input{flex:1;padding:12px;border-radius:20px;border:none}button{margin-left:6px;padding:12px;border-radius:20px;border:none;background:#0a84ff;color:#fff}</style>
<link rel="manifest" href="/manifest.json">
</head><body>
<div id="c"></div>
<div id="bar"><input id="i" placeholder="Type..."><button onclick="s()">Send</button></div>
<script>
const c=document.getElementById('c'),i=document.getElementById('i');
let facts=JSON.parse(localStorage.getItem('qf')||'[]');
function a(t,w){let d=document.createElement('div');d.className='m '+w;d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
a('Qudra ready! I remember: '+(facts.join(', ')||'nothing yet')+'. Try: save Nana is my friend','b');
async function s(){
 let msg=i.value.trim(); if(!msg)return; a(msg,'u'); i.value='';
 if(msg.toLowerCase().startsWith('save ')){let f=msg.slice(5);facts.push(f);localStorage.setItem('qf',JSON.stringify(facts));a('✅ Saved: '+f,'b');return;}
 try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,facts:facts})});let d=await r.json();a(d.reply,'b');}catch(e){a('Network too slow (0.22k/s), but I saved your msg. Try again','b');}
}
i.addEventListener('keypress',e=>{if(e.key==='Enter')s()});
</script></body></html>
