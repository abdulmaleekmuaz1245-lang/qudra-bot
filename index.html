<!DOCTYPE html>
<html>
<head>
<title>Q OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#050510;color:#fff;font-family:monospace;margin:0;display:flex;height:100vh}
#engines{width:140px;border-right:1px solid #a855f7;padding:10px;font-size:12px}
#chat{flex:1;display:flex;flex-direction:column}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{padding:14px;border-radius:14px;max-width:85%}
.user{background:#a855f7;align-self:flex-end}
.bot{border:1px solid #00f5ff;background:#0a0a20;align-self:flex-start}
#inputBar{display:flex;gap:10px;padding:10px;margin:10px;border:1px solid #00f5ff;border-radius:30px}
#inputBar input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:16px}
button{background:#00f5ff;border:0;border-radius:50%;width:44px;height:44px}
#mem{width:160px;border-left:1px solid #a855f7;padding:10px;font-size:11px}
</style>
</head>
<body>
<div id="engines">
<h3 style="color:#00f5ff">Q OS</h3>
<div style="color:#00ff88">● THINK ONLINE</div>
<div style="color:#00ff88">● MEMORY ONLINE</div>
<div style="color:#00ff88">● FETCH ONLINE</div>
<div style="color:#00ff88">● SOUL ONLINE</div>
<div style="color:#00ff88">● RAM ONLINE</div>
<div style="color:#00ff88">● BOOT ONLINE</div>
<div style="margin-top:40px">HEALTH 98%</div>
</div>

<div id="chat">
<div id="messages">
<div class="msg bot">Q OS BRAIN is online. All 6 engines active. Ya Salam King! How can I assist?</div>
</div>
<div id="inputBar">
<input id="msgInput" placeholder="Ya Salam...">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<div id="mem">
<b>PERMANENT MEMORIES</b>
<div id="memA">A: ...</div>
<div id="memB">B: ...</div>
<div id="memC">C: ...</div>
<div id="memD">D: ...</div>
<hr>
<b>RAM SLOTS (7)</b>
<div id="ram">empty</div>
</div>

<script>
async function sendMsg(){
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if(!txt) return;
  const box = document.getElementById('messages');
  const u = document.createElement('div'); u.className='msg user'; u.innerText=txt; box.appendChild(u);
  inp.value='';
  box.scrollTop = box.scrollHeight;
  
  const typing = document.createElement('div'); typing.className='msg bot'; typing.id='typing'; typing.innerText='Q OS thinking...'; box.appendChild(typing);
  
  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: txt})
    });
    const data = await res.json();
    document.getElementById('typing').remove();
    const b = document.createElement('div'); b.className='msg bot'; b.innerText=data.reply; box.appendChild(b);
    box.scrollTop = box.scrollHeight;
    loadMem();
  }catch(err){
    document.getElementById('typing').remove();
    const b = document.createElement('div'); b.className='msg bot'; b.innerText='ERROR: '+err.message+' - Check Render logs'; box.appendChild(b);
  }
}
function loadMem(){
  fetch('/api/health').then(r=>r.json()).then(d=>{
    document.getElementById('memA').innerText='A: RAM '+d.ram+'/7';
    document.getElementById('ram').innerText=d.ram+' used';
  }).catch(()=>{});
}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
loadMem();
</script>
</body>
</html>
