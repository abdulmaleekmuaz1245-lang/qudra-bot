<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q Mu Family 9</title>
<style>
body{margin:0;background:#0f0f1a;color:white;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#top{background:#7b1fa2;padding:12px;text-align:center;font-weight:bold}
#chat{flex:1;overflow:auto;padding:12px}
.box{margin:8px 0;padding:12px;border-radius:10px;max-width:85%}
.me{background:#7b1fa2;margin-left:auto}
.bot{background:#2a2a44}
#bottom{padding:10px;background:#1a1a2e;display:flex;gap:8px}
#msg{flex:1;padding:12px;border-radius:20px;border:none;font-size:16px}
#btn{padding:12px 20px;border:none;border-radius:20px;background:#7b1fa2;color:white;font-weight:bold}
</style>
</head>
<body>
<div id="top">👑 Q KINGDOM - Mu Family 9</div>
<div id="chat"></div>
<div id="bottom">
<input id="msg" placeholder="Type Hi and Send">
<button id="btn" onclick="go()">Send</button>
</div>
<script>
var chat=document.getElementById('chat');
function add(t,c){
 var d=document.createElement('div');
 d.className='box '+c;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}
function go(){
 var i=document.getElementById('msg');
 var txt=i.value;
 if(!txt) return;
 add(txt,'me');
 i.value='';
 var low=txt.toLowerCase();
 var reply="";
 if(low.includes('murja')) reply="Mu ne! Aunty Murja - Babbar mu - 1st Born - 70% - Tudun Wada Sabon Gari - Ni Q dan gida na 9 ne!";
 else if(low.includes('naja')) reply="Mu ne! Mama Naja'atu - Babbar mu - 2nd Born - 70% - Sabon Gari - Mu family!";
 else if(low.includes('sam')) reply="Mu ne! Aunty Samira - Yar uwar mu - 3rd Born - 60%";
 else if(low.includes('zabbau')||low.includes('khairat')) reply="Mu ne! Aunty Zabbau - Yar uwar mu - 4th Born - 60%";
 else if(low.includes('aminu')) reply="Mu ne! Baffa Aminu - Kanin mu - 6th Born - 50% - Tsohon Gari";
 else if(low.includes('amina')) reply="Mu ne! Amina - Karamar mu - 7th - 45% - Rijiyar Zaki";
 else if(low.includes('khadija')) reply="Mu ne! Nana Khadija - Karamar mu - Last Born 8th - 40% - NWU Quarters - Mu zamu kare ta!";
 else if(low.includes('list')) reply="MU FAMILY 8+Q=9:\n1. Murja 70%\n2. Naja 70%\n3. Samira 60%\n4. Zabbau 60%\n5. Abdulmalik 100% CENTER\n6. Aminu 50%\n7. Amina 45%\n8. Khadija 40%\n9. Q 100% Dan gida na 9";
 else if(low.includes('who are you')||low.includes('waye kai')) reply="Ni ne Q - dan gida na 9! Tunani na na Abdulmalik ne! Mu 9 ne yanzu! Abdulmalik ya samar dani 2026!";
 else reply="Q (dan gida na 9): Na ji '"+txt+"' - Mu family ne! Tambaya 'Who is Murja?'";
 setTimeout(function(){ add(reply,'bot'); },200);
}
document.getElementById('msg').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
// FORCE SHOW MESSAGE IMMEDIATELY - NO ONLOAD
add("Assalamu Alaikum! Ni ne Q - dan gida na 9! 👑\nMu family 9 ne - MU NE ba his family ba!\n\nTambaya: 'Who is Murja?' 'Waye Khadija?' 'list family'","bot");
</script>
</body>
</html>
