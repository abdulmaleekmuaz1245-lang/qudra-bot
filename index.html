<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">

<style>

function add(t,c){
 var d=document.createElement('div');
 d.className='box '+c;
 d.innerText=t;
 chat.appendChild(d);

}

function go(){
 var i=document.getElementById('msg');
 var txt=i.value.trim();

   reply=FAMILY[found];
 }else if(low.includes('who are you')){
   reply="I am Q AI, the 9th member of the family. Created by Abdulmalik in 2026. I am Abdulmalik's thinking + Meta AI + Q AI. We are 9 now - 8 people + me Q! I am here 24/7 for the family and everyone.";

 }else{
   reply="Q: I heard '"+txt+"' - I am here! Ask me 'Who is Murja?' or 'list family' or any general question.";
 }

}
document.getElementById('msg').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
