<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q KINGDOM Control Center 👑</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui;overflow:hidden;background:#000;color:#fff}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 500px at 20% 10%, rgba(255,215,0,.18), transparent),radial-gradient(700px 400px at 80% 90%, rgba(255,165,0,.15), transparent),linear-gradient(135deg,#000,#080800,#1a1500)}
.top{position:fixed;top:0;left:0;right:0;height:62px;z-index:100;background:linear-gradient(90deg, rgba(0,0,0,.95), rgba(50,35,0,.95));border-bottom:3px solid gold;box-shadow:0 0 25px gold;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.title{font-weight:900;color:gold;text-shadow:0 0 12px gold;font-size:13px}
.links{display:flex;gap:6px}
.links span{padding:6px 10px;border-radius:12px;background:rgba(255,215,0,.2);border:1.5px solid gold;cursor:pointer;font-size:10px;font-weight:bold;box-shadow:0 0 8px gold}
.chat{position:absolute;top:62px;bottom:78px;left:0;right:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column}
.msg{padding:14px 17px;margin:8px 0;border-radius:20px;max-width:88%;line-height:1.6;white-space:pre-wrap}
.me{margin-left:auto;background:linear-gradient(90deg,#b8860b,#ffd700);color:#000;font-weight:700}
.bot{background:rgba(35,35,60,.95);border:1.5px solid rgba(255,215,0,.25)}
.owner{background:linear-gradient(135deg,#3a2a00,#6a4d00);border:2.5px solid gold;color:#ffeb3b;box-shadow:0 0 25px gold}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:linear-gradient(90deg, rgba(0,0,0,.98), rgba(40,25,0,.98));border-top:3px solid gold;display:flex;align-items:center;gap:10px;padding:10px 12px}
#drawBtn{width:54px;height:54px;border-radius:50%;background:#111;border:2.5px solid gold;color:gold;font-size:24px;cursor:pointer;box-shadow:0 0 15px gold;flex-shrink:0}
#inp{flex:1;height:54px;padding:0 20px;border-radius:28px;border:2px solid rgba(255,215,0,.35);outline:0;background:rgba(25,25,40,.95);color:#fff;font-size:16px}
#sendBtn{height:54px;padding:0 28px;background:linear-gradient(90deg,#ffd700,#ffb700);color:#000;border:0;border-radius:28px;font-weight:900;cursor:pointer}
#drawModal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;padding:14px}
#canvasWrap{flex:1;background:#0a0a0a;border:3px solid gold;border-radius:16px;overflow:hidden}
#drawCanvas{width:100%;height:100%;touch-action:none}
.toolBtn{padding:9px 15px;border-radius:22px;border:1.5px solid gold;background:rgba(255,215,0,.18);color:gold;cursor:pointer;font-weight:bold}
#ownerDash{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:300;display:none;overflow-y:auto;padding:72px 14px 20px}
.dashCard{background:linear-gradient(135deg, rgba(50,35,0,.95), rgba(30,25,60,.95));border:2.5px solid gold;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 0 25px rgba(255,215,0,.25)}
</style>
</head>
<body>
<div class="top"><div class="title">👑 Q CONTROL CENTER</div><div class="links"><span onclick="goPublic()">🌍 PUBLIC</span><span onclick="goOwner()">🔐 OWNER</span></div></div>
<div class="chat" id="chat"></div>
<div class="bottom"><button id="drawBtn">🎨</button><input id="inp" type="text" placeholder="Chat... Type dashboard for control" autocomplete="off"><button id="sendBtn">SEND</button></div>
<div id="drawModal"><div style="display:flex;justify-content:space-between;color:gold;font-weight:900;padding:8px 0"><span>🎨 Q DRAW</span><span onclick="closeDraw()" style="font-size:26px;cursor:pointer">✕</span></div><div id="canvasWrap"><canvas id="drawCanvas"></canvas></div><div style="display:flex;gap:8px;padding:12px 0;flex-wrap:wrap"><button class="toolBtn" onclick="setColor('gold')">Gold</button><button class="toolBtn" onclick="setColor('white')">White</button><button class="toolBtn" onclick="setColor('#ff4444')">Red</button><button class="toolBtn" onclick="clearCanvas()">Clear</button><button class="toolBtn" style="background:gold;color:black" onclick="sendDrawing()">Send →</button></div></div>
<div id="ownerDash"><div style="position:fixed;top:0;left:0;right:0;height:62px;background:#000;border-bottom:3px solid gold;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10"><b style="color:gold">👑 Q OWNER DASHBOARD</b><span onclick="closeDash()" style="font-size:26px;cursor:pointer;color:gold">✕</span></div><div class="dashCard"><b>🔗 Your Direct Links - No Password!</b><br><br>🌍 Public Direct: <code id="pubLink"></code><br><br>🔐 Owner Direct: <code id="ownLink"></code><br><br><button onclick="copyPub()" style="padding:8px 12px;background:gold;border:0;border-radius:8px;font-weight:bold">Copy Public</button> <button onclick="copyOwn()" style="padding:8px 12px;background:white;border:0;border-radius:8px;font-weight:bold">Copy Owner</button></div><div class="dashCard"><b>🧠 Brain System</b><br><br><span id="brainStatus"></span></div><div class="dashCard"><b>👑 Q Kingdom Family</b><br><br><span id="famList"></span></div></div>
<script>
let isOwner=false;
let chat=document.getElementById('chat'), inp=document.getElementById('inp'), sendBtn=document.getElementById('sendBtn'), drawBtn=document.getElementById('drawBtn'), drawModal=document.getElementById('drawModal'), ownerDash=document.getElementById('ownerDash'), canvas=document.getElementById('drawCanvas'), ctx=canvas.getContext('2d'), drawing=false, curColor='gold';
const FAMILY=[{n:"Murja",p:"1st 70% Senior Queen"},{n:"Najaatu",p:"2nd 70% Calm Queen"},{n:"Samira",p:"3rd 60%"},{n:"Zabbau",p:"4th 60% Maman Khairat"},{n:"Abdulmalik",p:"5th CENTER 100% KING - Creator"},{n:"Aminu",p:"6th 50%"},{n:"Amina Baby",p:"7th 45%"},{n:"Khadija",p:"8th Last 40% Princess"}];
function addMsg(t,type){let d=document.createElement('div');d.className='msg '+type;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addImgMsg(src){let d=document.createElement('div');d.className='msg me';let img=document.createElement('img');img.src=src;img.style.maxWidth='100%';img.style.borderRadius='14px';img.style.border='3px solid gold';d.appendChild(img);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function qBrain(t){
 let low=t.toLowerCase().trim();
 if(low==='dashboard'){openDash();return{text:"Opening Dashboard...",type:isOwner?"owner":"bot"};}
 if(low==='family list'){let s="👑 Q Kingdom:\n\n";FAMILY.forEach(f=>{s+=`${f.n} - ${f.p}\n\n`;});return{text:s,type:isOwner?"owner":"bot"};}
 return{text:`${isOwner?"👑 Owner Mode - Full Control!":"🌍 Public Mode"} - "${t}" received!`,type:isOwner?"owner":"bot"};
}
function send(){let v=inp.value.trim();if(!v)return;addMsg(v,'me');inp.value='';let r=qBrain(v);setTimeout(()=>addMsg(r.text,r.type),150);}
function goPublic(){window.location.href=window.location.origin+'/?public';}
function goOwner(){window.location.href=window.location.origin+'/?owner';}
function updateLinks(){let base=window.location.origin;document.getElementById('pubLink').textContent=base+'/?public';document.getElementById('ownLink').textContent=base+'/?owner';document.getElementById('brainStatus').innerHTML=`Mode: ${isOwner?'OWNER 👑 - Full Control - Direct Link, No Password!':'PUBLIC 🌍 - Direct Link'}<br>Background: Fantasy Golden Black ✨<br>Left: 🎨 | Right: SEND`;let html="";FAMILY.forEach(f=>{html+=`${f.n} - ${f.p}<br>`;});document.getElementById('famList').innerHTML=html;}
function copyPub(){navigator.clipboard.writeText(window.location.origin+'/?public');alert("Public link copied!");}
function copyOwn(){navigator.clipboard.writeText(window.location.origin+'/?owner');alert("Owner link copied!");}
function openDraw(){drawModal.style.display='flex';setTimeout(resizeCanvas,100);}
function closeDraw(){drawModal.style.display='none';}
function resizeCanvas(){let rect=document.getElementById('canvasWrap').getBoundingClientRect();canvas.width=rect.width;canvas.height=rect.height;ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=curColor;ctx.lineWidth=4;ctx.lineCap='round';}
function setColor(c){curColor=c;ctx.strokeStyle=c;}
function clearCanvas(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,canvas.width,canvas.height);}
function getPos(e){let rect=canvas.getBoundingClientRect();let x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;let y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;return{x,y};}
canvas.addEventListener('mousedown',e=>{drawing=true;let p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
canvas.addEventListener('mousemove',e=>{if(!drawing)return;let p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;let p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;let p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);
function sendDrawing(){let data=canvas.toDataURL();closeDraw();addImgMsg(data);setTimeout(()=>addMsg("🎨 Drawing sent!", isOwner?"owner":"bot"),300);}
function openDash(){updateLinks();ownerDash.style.display='block';}
function closeDash(){ownerDash.style.display='none';}
drawBtn.addEventListener('click',openDraw);sendBtn.addEventListener('click',send);inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
(function(){
let url=window.location.search;
if(url.includes('public')){isOwner=false;}
if(url.includes('owner')){isOwner=true;}
updateLinks();
addMsg(`👑 Q CONTROL CENTER v4.0 - DIRECT LINKS!\n\nNo more password! No more prompt!\n\n🌍 PUBLIC DIRECT: ${window.location.origin}/?public\n👑 OWNER DIRECT: ${window.location.origin}/?owner\n\nMode: ${isOwner?'OWNER 👑 - Full Control Direct!':'PUBLIC 🌍 - Public Direct!'}`, isOwner?"owner":"bot");
})();
</script>
</body>
</html>
