<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q A.I • Fantasy Blue</title>
<style>
body { margin:0; font-family: Arial; background:#eaf6ff; }
.header { background: linear-gradient(90deg,#6bb8ff,#3a8cff); padding:15px; color:white; display:flex; justify-content:space-between; align-items:center; }
.logo { font-weight:bold; font-size:18px; }
.online { background:white; color:#3a8cff; padding:8px 15px; border-radius:20px; display:flex; align-items:center; gap:8px; }
.dot { width:10px; height:10px; background:#00ff7f; border-radius:50%; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
#chatBox { height:70vh; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px; }
.q-msg { background:white; padding:12px 15px; border-radius:18px 18px 18px 5px; max-width:80%; box-shadow:0 2px 5px rgba(0,0,0,0.1); align-self:flex-start; }
.user-msg { background:#3a8cff; color:white; padding:12px 15px; border-radius:18px 18px 5px 18px; max-width:80%; align-self:flex-end; }
.inputArea { position:fixed; bottom:0; left:0; right:0; background:white; padding:10px; display:flex; gap:10px; border-top:1px solid #ddd; }
#userInput { flex:1; padding:12px 15px; border-radius:25px; border:1px solid #ccc; outline:none; }
button { background:#3a8cff; color:white; border:none; width:45px; height:45px; border-radius:50%; font-size:20px; cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Q FANTASY • BLUE TECH</div>
  <div class="online"><div class="dot"></div> Q A.I • Fantasy Blue • Online ✨</div>
</div>

<div id="chatBox">
  <div class="q-msg">
    <b>Q</b> Hey King! Welcome to Q A.I Fantasy Blue ✨<br><br>
    Built by Abdulmalik with light blue magic! Chat with me or press 🎨 to draw!
    <div style="font-size:12px; color:gray; margin-top:5px;">Fantasy Mode • 2:00 PM</div>
  </div>
</div>

<div class="inputArea">
  <input id="userInput" placeholder="Ask Q anything magical..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button onclick="alert('Drawing mode coming soon! 🎨')">🎨</button>
  <button onclick="sendMessage()">➤</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if(!msg) return;
  
  // Add user message
  const box = document.getElementById('chatBox');
  const userDiv = document.createElement('div');
  userDiv.className = 'user-msg';
  userDiv.innerText = msg;
  box.appendChild(userDiv);
  input.value = '';
  box.scrollTop = box.scrollHeight;

  // Add thinking...
  const thinking = document.createElement('div');
  thinking.className = 'q-msg';
  thinking.innerText = 'Q dey think... ✨';
  box.appendChild(thinking);
  box.scrollTop = box.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    thinking.innerHTML = '<b>Q</b> ' + data.reply;
  } catch (e) {
    thinking.innerText = 'Q A.I Fantasy Blue reply go here! Your API go connect later ✨ - But now connected! Try again King!';
  }
  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
