<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q A.I</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:system-ui;background:#000;color:#fff;overflow:hidden}body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 400px at 15% 15%,rgba(255,215,0,.28),transparent 70%),linear-gradient(135deg,#000,#1a1500)} .header{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(0,0,0,.96);border-bottom:3px solid gold;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:100}.logo{width:40px;height:40px;border-radius:50%;background:gold;border:2px solid gold;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}.center-title{font-weight:900;font-size:23px;color:gold}.right-small{font-size:10px;color:#ffda75;text-align:right}.links-bar{position:fixed;top:64px;left:0;right:0;height:38px;background:rgba(0,0,0,.88);border-bottom:1.5px solid gold;display:flex;justify-content:center;gap:12px;z-index:99}.link-btn{padding:6px 16px;border-radius:20px;border:1.5px solid gold;background:rgba(255,215,0,.15);color:gold;font-size:11px;font-weight:bold;cursor:pointer}.link-btn.active{background:gold;color:#000}.chat{position:absolute;top:102px;bottom:78px;left:0;right:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column}.msg{padding:13px 16px;margin:8px 0;border-radius:20px;max-width:86%;line-height:1.6;white-space:pre-wrap;font-size:14px}.me{margin-left:auto;background:linear-gradient(90deg,#b8860b,#ffd700);color:#000;font-weight:700}.owner,.guest{background:linear-gradient(135deg,#3a2a00,#5a4200);border:2px solid gold;color:#ffeb8a}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#000;border-top:3px solid gold;display:flex;align-items:center;gap:8px;padding:10px;z-index:100}#inp{flex:1;height:50px;border-radius:25px;border:2px solid gold;background:#222;color:#fff;padding:0 18px;outline:0}#sendBtn{height:50px;padding:0 22px;border-radius:25px;background:gold;color:#000;border:0;font-weight:900}</style></head><body><div class="header"><div class="logo">Q</div><div class="center-title">Q A.I</div><div class="right-small">build by<br>Abdulmalik</div></div><div class="links-bar"><span id="pubBtn" class="link-btn" onclick="location.href='/?public'">🌍 PUBLIC</span><span id="ownBtn" class="link-btn" onclick="location.href='/?owner'">👑 OWNER</span></div><div class="chat" id="chat"></div><div class="bottom"><input id="inp" placeholder="Ask Q..."><button id="sendBtn">SEND</button></div><script>
let isOwner=location.search.includes('owner'),isPublic=location.search.includes('public');let chatEl=document.getElementById('chat'),inp=document.getElementById('inp');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
async function sendMsg(){let v=inp.value.trim();if(!v)return;add(v,'me');inp.value='';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,isOwner})});let data=await r.json();add(data.reply,isOwner?'owner':'guest')}catch(e){add('Server waking... try again',isOwner?'owner':'guest')}}
(function(){let pub=document.getElementById('pubBtn'),own=document.getElementById('ownBtn');if(isPublic){own.style.display='none';pub.classList.add('active');pub.textContent='🌍 Q A.I PUBLIC'}else if(isOwner){own.classList.add('active')}add(isOwner?`👑 SMART BRAIN ONLINE!\nTry:\n- what do u have in your memory?\n- Do you know Khadijah?\n- Do you know Anas?`:`🌍 Q SMART - Ask me "Do you know Khadijah?"`,isOwner?'owner':'guest')})();
document.getElementById('sendBtn').onclick=sendMsg;inp.onkeydown=e=>{if(e.key==='Enter')sendMsg()};
</script></body></html>
