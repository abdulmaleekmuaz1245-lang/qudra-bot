<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
header{padding:15px;background:linear-gradient(90deg,#4a00e0,#8e2de2,#ff00cc);display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid gold}
header b{color:#fff;text-shadow:0 0 10px gold;font-size:18px}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 20% 30%, #1a0033 0%, #000 60%)}
.msg{max-width:80%;padding:10px 14px;border-radius:15px}
.user{align-self:flex-end;background:linear-gradient(90deg,#4a00e0,#8e2de2);box-shadow:0 0 10px #8e2de2}
.bot{align-self:flex-start;background:#111;border:1px solid #8e2de2;box-shadow:0 0 10px #4a00e0}
#box{display:flex;padding:10px;background:#111;gap:8px;border-top:1px solid #8e2de2}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #8e2de2;background:#000;color:#fff}
button{padding:10px 20px;border-radius:20px;border:none;background:linear-gradient(90deg,#ff00cc,#8e2de2);color:#fff;font-weight:bold}
</style></head><body>
<header><b>👑 Q FANTASY KINGDOM ✨</b><span id="o" style="background:gold;color:#000;padding:2px 8px;border-radius:10px;font-size:11px;display:none">OWNER</span></header>
<div id="chat"></div>
<div id="box"><input id="i" placeholder="Ask Q..."><button onclick="s()">Send</button></div>
<script>
let O=localStorage.getItem('O')||'ABDULMALIK';localStorage.setItem('O',O);let U=localStorage.getItem('U')||'abdulmalik_'+Math.random().toString(36).slice(2);localStorage.setItem('U',U);
if(O==='ABDULMALIK')document.getElementById('o').style.display='inline';
let C=document.getElementById('chat');function A(t,k){let d=document.createElement('div');d.className='msg '+k;d.textContent=t;C.appendChild(d);C.scrollTop=99999;return d}
A('Oga Abdulmalik! Fantasy Kingdom don open! 👑🔥','bot');
async function s(){let I=document.getElementById('i'),t=I.value.trim();if(!t)return;A(t,'user');I.value='';let b=A('Q dey think...','bot');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,userId:U,ownerName:O})});let d=await r.json();b.textContent=d.reply;}catch(e){b.textContent='Network jam'}} 
document.getElementById('i').addEventListener('keydown',e=>{if(e.key==='Enter')s()});
</script></body></html>
