<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q AI - By Abdulmalik</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #00ff88;color:#00ff88;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{margin:10px 0;padding:12px;border-radius:10px;max-width:80%}
.user{background:#00ff88;color:#000;margin-left:auto}
.bot{background:#222;border:1px solid #333}
footer{display:flex;padding:10px;background:#111}
input{flex:1;padding:12px;border-radius:25px;border:none;outline:none}
button{margin-left:10px;padding:12px 20px;border-radius:25px;border:none;background:#00ff88;font-weight:bold}
</style>
</head>
<body>
<header>Q AI - Build by Abdulmalik</header>
<div id="chat">
<div class="msg bot">You are welcome, I'm Q AI, build by Abdulmalik, how can I help you?</div>
</div>
<footer>
<input id="input" placeholder="Type message...">
<button onclick="send()">Send</button>
</footer>
<script>
async function send(){
const i=document.getElementById('input');
const c=document.getElementById('chat');
if(!i.value) return;
c.innerHTML+=`<div class="msg user">${i.value}</div>`;
const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:i.value})});
const data=await res.json();
c.innerHTML+=`<div class="msg bot">${data.reply}</div>`;
i.value=''; c.scrollTop=c.scrollHeight;
}
document.getElementById('input').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
