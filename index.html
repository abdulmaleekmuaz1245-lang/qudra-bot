<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q V2 - Full Brain</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:15px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.4}
.user{align-self:flex-end;background:#1e90ff}
.bot{align-self:flex-start;background:#1f1f1f;border:1px solid #333}
#box{display:flex;padding:10px;background:#111;gap:8px}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
button{padding:10px 18px;border-radius:20px;border:none;background:#1e90ff;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><b>🧠 Q V2 - FULL BRAIN</b><span style="font-size:12px;color:#0f0">● LIVE</span></header>
<div id="chat"><div class="msg bot">I be Q V2! Full brain don enter! Abdulmalik build me with 3 brains combined. Wetin we go build today? 🔥</div></div>
<div id="box"><input id="inp" placeholder="Ask Q anything..."><button onclick="send()">Send</button></div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const uid='user_'+Math.random().toString(36).slice(2);
async function send(){
  const txt=inp.value.trim(); if(!txt)return;
  chat.innerHTML+=`<div class="msg user">${txt}</div>`; inp.value='';
  chat.scrollTop=chat.scrollHeight;
  const id=document.createElement('div'); id.className='msg bot'; id.textContent='Q dey think...'; chat.appendChild(id);
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt,userId:uid})});
    const data=await res.json();
    id.textContent=data.reply;
  }catch(e){id.textContent='Network jam, try again';}
  chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
