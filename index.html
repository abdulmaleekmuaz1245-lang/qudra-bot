<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qudra Bot by Abdulmalik</title>
<style>
body{font-family:Arial;background:#111;color:white;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{margin:8px 0;padding:10px;border-radius:10px;max-width:80%}
.user{background:#0a84ff;margin-left:auto}
.bot{background:#2a2a2a}
#bar{display:flex;padding:10px;background:#222}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{margin-left:8px;padding:12px 18px;border-radius:20px;border:none;background:#0a84ff;color:white}
#adminBtn{position:fixed;top:10px;right:10px;font-size:11px;padding:5px 8px;background:#333;opacity:0.7}
</style>
</head>
<body>

<button id="adminBtn" onclick="makeAdmin()">I'm Owner</button>
<div id="chat"></div>
<div id="bar">
<input id="input" placeholder="Talk to Qudra...">
<button onclick="sendMessage()">Send</button>
</div>

<script>
let chatHistory = JSON.parse(localStorage.getItem('qudra_chat') || "[]");
let isOwner = localStorage.getItem('qudra_admin') === 'true';
const chatDiv = document.getElementById('chat');
const input = document.getElementById('input');

function makeAdmin(){
  localStorage.setItem('qudra_admin','true');
  isOwner=true;
  alert('✅ You are now ADMIN! Qudra go recognize you as Oga Abdulmalik');
  addMsg('ADMIN MODE ON - Welcome Oga Abdulmalik!', 'bot');
}

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerText = text;
  chatDiv.appendChild(d);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

// Load old chat
chatHistory.forEach(m => addMsg(m.content, m.role==='user'?'user':'bot'));

async function sendMessage(){
  const msg = input.value.trim();
  if(!msg) return;
  addMsg(msg, 'user');
  input.value='';
  chatHistory.push({role:'user', content: msg});
  
  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ 
        message: msg, 
        history: chatHistory.slice(-10),
        isAdmin: isOwner
      })
    });
    const data = await res.json();
    if(data.isAdminSuccess){
      localStorage.setItem('qudra_admin','true');
      isOwner=true;
    }
    addMsg(data.reply, 'bot');
    chatHistory.push({role:'assistant', content: data.reply});
    localStorage.setItem('qudra_chat', JSON.stringify(chatHistory));
  }catch(e){
    addMsg('Network error - check data', 'bot');
  }
}

input.addEventListener('keypress', (e)=>{ if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
