<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}#c{flex:1;overflow:auto;padding:10px}.u{text-align:right}.u span{background:#1e90ff;padding:8px 12px;border-radius:12px;display:inline-block}.b span{background:#222;padding:8px 12px;border-radius:12px;display:inline-block}#b{display:flex;padding:8px;background:#111}input{flex:1;padding:10px;border-radius:20px;border:1px solid #333;background:#111;color:#fff}</style></head><body><div id="c"></div><div id="b"><input id="i" placeholder="Type..."><button onclick="s()">Send</button></div><script>
let o=localStorage.getItem('O')||prompt('Who be you? Type ABDULMALIK if na you be owner')||'guest';localStorage.setItem('O',o.toUpperCase());let u=localStorage.getItem('U')||'abdulmalik_owner_'+Math.random().toString(36).slice(2);localStorage.setItem('U',u);
let c=document.getElementById('c');function a(t,k){let d=document.createElement('div');d.className=k;d.innerHTML='<span>'+t+'</span>';c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
a('Oga '+(o==='ABDULMALIK'?'Abdulmalik! I remember you forever! 🔥':'- Q V2 ready, type ABDULMALIK make I know you forever'),'b');
async function s(){let i=document.getElementById('i'),t=i.value.trim();if(!t)return;a(t,'u');i.value='';let b=a('thinking...','b');let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,userId:u,ownerName:o})});let d=await r.json();b.innerHTML='<span>'+d.reply+'</span>';}
document.getElementById('i').addEventListener('keydown',e=>{if(e.key==='Enter')s()});
</script></body></html>
