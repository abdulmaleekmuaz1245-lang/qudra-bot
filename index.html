<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q OS GLOBAL | 36 States - One Market</title>
</head>
<body>
  <header>
    <h1>Q OS GLOBAL</h1>
    <p>36 States • One Market • Powered by Q AI</p>
  </header>

  <section id="search-hub">
    <input type="search" placeholder="Search product, shop, state...">
    <div class="filters">
      <select><option>All 36 States</option><option>Rivers</option><option>Lagos</option></select>
      <select><option>All Products</option></select>
    </div>
  </section>

  <main>
    <section>
      <h2>Featured Shops</h2>
      <div class="shop-grid">
        <article class="shop-card">
          <h3>Shop Name</h3>
          <p>Port Harcourt, Rivers</p>
          <button>Enter Shop</button>
        </article>
      </div>
    </section>
  </main>

  <section id="agent-zone" hidden><h2>Agent Control</h2></section>
  <section id="add-shop-form" hidden><h2>Register New Shop</h2></section>
  <section id="pay-hub" hidden><h2>Q Pay</h2></section>

  <button id="q-fab">Q</button>
  <nav>
    <button>Home</button>
    <button>Agent</button>
    <button>Add Shop</button>
    <button>Pay</button>
  </nav>
</body>
</html>
